<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suseto Administrace</title>
    <!-- Bootstrap 5 CSS pro rychlý responzivní design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-container { max-width: 400px; margin: 10vh auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .sidebar { min-height: 100vh; background-color: #212529; color: #fff; padding-top: 1rem; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 0.75rem 1.25rem; display: block; border-radius: 4px; margin-bottom: 0.25rem; }
        .sidebar a:hover, .sidebar a.active { background-color: #343a40; color: #fff; }
        .content-area { padding: 2rem; display: none; } /* Defaultně skryté, řídí JS */
        .scan-img { max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover; cursor: pointer; }
        #app-container { display: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1055; }
    </style>
</head>
<body>

    <!-- Notifikační systém -->
    <div class="toast-container" id="toastBox"></div>

    <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
    <div class="container" id="login-view">
        <div class="login-container">
            <h3 class="text-center mb-4">Suseto Admin</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Uživatelské jméno</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Heslo</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Přihlásit se</button>
            </form>
        </div>
    </div>

    <!-- HLAVNÍ APLIKACE (Zobrazí se po přihlášení) -->
    <div class="container-fluid" id="app-container">
        <div class="row">
            <!-- Boční navigace -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky">
                    <h5 class="px-3 mb-3 text-white">Administrace</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="nav-link">Dashboard</a></li>
                        <li class="nav-item"><a href="#" onclick="navigate('scans')" id="nav-scans" class="nav-link">Historie Skenů</a></li>
                        <li class="nav-item"><a href="#" onclick="navigate('logs')" id="nav-logs" class="nav-link">Systémové Logy</a></li>
                        <li class="nav-item"><a href="#" onclick="navigate('users')" id="nav-users" class="nav-link">Uživatelé</a></li>
                        <li class="nav-item"><a href="#" onclick="navigate('settings')" id="nav-settings" class="nav-link">Nastavení</a></li>
                    </ul>
                    <hr>
                    <div class="px-3">
                        <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">Odhlásit</button>
                    </div>
                </div>
            </nav>

            <!-- Dynamický obsah -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div id="view-dashboard" class="content-area">
                    <h2 class="mt-3 border-bottom pb-2">Přehled systému</h2>
                    <div class="row mt-4" id="dashboard-content">Načítání...</div>
                </div>

                <div id="view-scans" class="content-area">
                    <h2 class="mt-3 border-bottom pb-2">Globální historie skenů</h2>
                    <div class="table-responsive mt-3">
                        <table class="table table-striped table-hover">
                            <thead><tr><th>ID</th><th>Čas</th><th>Typ</th><th>Data</th><th>Fotografie</th></tr></thead>
                            <tbody id="scans-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="view-logs" class="content-area">
                    <h2 class="mt-3 border-bottom pb-2">Systémové logy</h2>
                    <div class="table-responsive mt-3">
                        <table class="table table-dark table-striped">
                            <thead><tr><th>Čas</th><th>Úroveň</th><th>Modul</th><th>Zpráva</th></tr></thead>
                            <tbody id="logs-tbody"></tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Sekce uživatelů a nastavení (obsah bude doplněn v dalších fázích) -->
                <div id="view-users" class="content-area"><h2 class="mt-3 border-bottom pb-2">Správa uživatelů</h2><div id="users-content"></div></div>
                <div id="view-settings" class="content-area"><h2 class="mt-3 border-bottom pb-2">Konfigurace</h2><div id="settings-content"></div></div>
            </main>
        </div>
    </div>

    <script>
        // FÁZE 1: Autentizační logika a pomocné funkce
        const API_URL = '/admin';

        function showToast(message, type = 'info') {
            const toastBox = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} alert-dismissible fade show`;
            toast.innerHTML = `${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            toastBox.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(API_URL + endpoint, options);
            if (response.status === 401) {
                document.getElementById('app-container').style.display = 'none';
                document.getElementById('login-view').style.display = 'block';
                throw new Error("Neautorizováno. Prosím, přihlaste se.");
            }
            return response.json();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await apiCall('/login', 'POST', { username, password });
                if (res.status === 'success') {
                    showToast('Přihlášení úspěšné', 'success');
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    navigate('dashboard'); // Spustí inicializaci dat
                } else {
                    showToast(res.message, 'danger');
                }
            } catch (err) {
                if(err.message !== "Neautorizováno. Prosím, přihlaste se.") showToast(err.message, 'danger');
            }
        });

        async function logout() {
            try {
                await apiCall('/logout', 'POST');
                location.reload();
            } catch (e) { location.reload(); }
        }

        // Zjednodušený router
        function navigate(viewName) {
            document.querySelectorAll('.content-area').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            
            const viewElement = document.getElementById('view-' + viewName);
            const navElement = document.getElementById('nav-' + viewName);
            
            if (viewElement) viewElement.style.display = 'block';
            if (navElement) navElement.classList.add('active');

            // Zavolání obslužných funkcí pro jednotlivé pohledy (Bude implementováno ve Fázi 2 a 3)
            if (viewName === 'dashboard' && typeof loadDashboard === 'function') loadDashboard();
            if (viewName === 'logs' && typeof loadLogs === 'function') loadLogs();
            if (viewName === 'scans' && typeof loadScans === 'function') loadScans();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
