{% extends "layout.html" %}
{% block title %}Workbench – Suseto{% endblock %}

{% block content %}
<div class="container" style="max-width:980px;margin:0 auto;padding:2rem 1rem 4rem;">
  <h1>Workbench</h1>
  <p>Interaktivní pracovní plocha pro analýzu, dekódování a testování vstupů.</p>

  <section class="card">
    <button id="wb_btn_ingest">Normalizovat a typovat</button>
    <button id="wb_btn_analyze">Spustit analýzu</button>
    <button id="wb_btn_reverse">Spustit RE analýzu</button>
    <button id="wb_btn_clear">Vymazat výstup</button>
    <button id="wb_btn_test">Spustit testy</button>
  </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/workbench.js') }}"></script>
{% endblock %}
