<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suseto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-layer-group"></i>
            Suseto
        </div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}"{% if request.path == '/' %} class="active"{% endif %}>Rozcestník</a>
            <a href="{{ url_for('navigator') }}"{% if request.path == '/navigator' %} class="active"{% endif %}>Navigator</a>
            <a href="{{ url_for('timeline.timeline_page') }}"{% if request.path == '/timeline' %} class="active"{% endif %}>Timeline</a>
        </div>
        <div class="nav-controls">
            <button class="theme-toggle" id="themeToggle" aria-label="Přepnout motiv">
                <i class="fas fa-sun"></i>
            </button>
            <div class="user-menu">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
