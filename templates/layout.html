<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suseto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-layer-group"></i>
            Suseto
        </div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}"{% if request.path == '/' %} class="active"{% endif %}>Rozcestník</a>
            <a href="{{ url_for('navigator') }}"{% if request.path == '/navigator' %} class="active"{% endif %}>Navigator</a>
            <a href="{{ url_for('core.timeline_page') }}"{% if request.path == '/timeline' %} class="active"{% endif %}>Timeline</a>
            <a href="{{ url_for('inventory_page') }}"{% if request.path == '/inventory' %} class="active"{% endif %}>Inventory</a>
            <a href="{{ url_for('runs_page') }}"{% if request.path == '/runs' %} class="active"{% endif %}>Runs</a>
            <a href="{{ url_for('registry') }}"{% if request.path == '/registry' %} class="active"{% endif %}>Registry</a>
            <a href="{{ url_for('aidc_studio') }}"{% if request.path == '/aidc' %} class="active"{% endif %}>AIDC</a>
            <a href="{{ url_for('decode_lab') }}"{% if request.path == '/decode' %} class="active"{% endif %}>Decode</a>
            <a href="{{ url_for('debug_page') }}"{% if request.path == '/debug' %} class="active"{% endif %}>Debug</a>
            <a href="{{ url_for('admin_page') }}"{% if request.path == '/admin' %} class="active"{% endif %}>Admin</a>
            <a href="{{ url_for('auth_logout') }}">Logout</a>
        </div>
        <div class="nav-controls">
            <button class="theme-toggle" id="themeToggle" aria-label="Přepnout motiv">
                <i class="fas fa-sun"></i>
            </button>
            <div class="user-menu">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
