<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Suseto v2{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/core.css') }}">
</head>
<body>
<header class="site-header">
  <div class="shell shell-header">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">&#8984;</span>
      <span class="brand-text">Suseto v2</span>
    </a>

    <nav class="topnav" aria-label="Hlavní navigace">
      <a href="{{ url_for('home') }}"{% if request.path == '/' %} class="active"{% endif %}>Rozcestník</a>

      <details class="nav-group"{% if request.path in ['/aidc-studio','/aidc-batch','/scanner-lab'] %} open{% endif %}>
        <summary>AIDC</summary>
        <div class="nav-menu">
          <a href="{{ url_for('aidc_studio') }}"{% if request.path == '/aidc-studio' %} class="active"{% endif %}>AIDC Studio</a>
          <a href="{{ url_for('aidc_batch') }}"{% if request.path == '/aidc-batch' %} class="active"{% endif %}>AIDC Batch</a>
          <a href="{{ url_for('scanner_lab') }}"{% if request.path == '/scanner-lab' %} class="active"{% endif %}>Scanner Lab</a>
        </div>
      </details>

      <details class="nav-group"{% if request.path in ['/decode-lab','/state-lab','/insight-lab','/transform-lab'] %} open{% endif %}>
        <summary>Analýza</summary>
        <div class="nav-menu">
          <a href="{{ url_for('decode_lab') }}"{% if request.path == '/decode-lab' %} class="active"{% endif %}>Decode Lab</a>
          <a href="{{ url_for('state_lab') }}"{% if request.path == '/state-lab' %} class="active"{% endif %}>State Lab</a>
          <a href="{{ url_for('insight_lab') }}"{% if request.path == '/insight-lab' %} class="active"{% endif %}>Insight Lab</a>
          <a href="{{ url_for('transform_lab') }}"{% if request.path == '/transform-lab' %} class="active"{% endif %}>Transform Lab</a>
        </div>
      </details>

      <details class="nav-group"{% if request.path in ['/registry','/label-profiles','/inventory','/locations','/dashboard'] %} open{% endif %}>
        <summary>Správa</summary>
        <div class="nav-menu">
          <a href="{{ url_for('registry') }}"{% if request.path == '/registry' %} class="active"{% endif %}>Registry</a>
          <a href="{{ url_for('label_profiles') }}"{% if request.path == '/label-profiles' %} class="active"{% endif %}>Label Profiles</a>
          <a href="{{ url_for('inventory') }}"{% if request.path == '/inventory' %} class="active"{% endif %}>Inventory</a>
          <a href="{{ url_for('locations_page') }}"{% if request.path == '/locations' %} class="active"{% endif %}>Locations</a>
          <a href="{{ url_for('dashboard') }}"{% if request.path == '/dashboard' %} class="active"{% endif %}>Dashboard</a>
        </div>
      </details>

      <details class="nav-group"{% if request.path in ['/debug','/health','/runs','/backup-center','/admin'] %} open{% endif %}>
        <summary>Systém</summary>
        <div class="nav-menu">
          <a href="{{ url_for('debug_page') }}"{% if request.path == '/debug' %} class="active"{% endif %}>Debug</a>
          <a href="{{ url_for('health') }}"{% if request.path == '/health' %} class="active"{% endif %}>Health</a>
          <a href="{{ url_for('runs') }}"{% if request.path == '/runs' %} class="active"{% endif %}>Runs</a>
          <a href="{{ url_for('backup_center') }}"{% if request.path == '/backup-center' %} class="active"{% endif %}>Backup Center</a>
          <a href="{{ url_for('admin_page') }}"{% if request.path == '/admin' %} class="active"{% endif %}>Admin</a>
        </div>
      </details>
    </nav>
  </div>
</header>

<main class="shell">
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/menu.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
