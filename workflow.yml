name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deploy: ${{ steps.filter.outputs.deploy }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'app.py'
              - 'services/**'
              - 'routes/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'pytest.ini'
            frontend:
              - 'templates/**'
              - 'static/**'
            workflows:
              - '.github/workflows/**'
            deploy:
              - 'app.py'
              - 'routes/**'
              - 'services/**'
              - 'templates/**'
              - 'static/**'
              - 'requirements*.txt'
            config:
              - 'services/config.py'
              - 'config/**'
              - '.env.example'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          FLASK_ENV: testing
          FLASK_CONFIG: testing
          SECRET_KEY: ci-secret-key
        run: pytest -q

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate templates and static files
        run: |
          test -d templates && find templates -type f | sort | head -n 200 || true
          test -d static && find static -type f | sort | head -n 200 || true

  smoke-import:
    needs: [changes, lint-and-test]
    if: always() && (needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.config == 'true') && needs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Import app
        env:
          SECRET_KEY: ci-secret-key
          FLASK_ENV: staging
          FLASK_CONFIG: staging
        run: |
          python - <<'PY'
          import app
          assert getattr(app, 'app', None) is not None
          print('ok')
          PY

  deploy-staging:
    needs: [changes, lint-and-test, frontend-check, smoke-import]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true' && (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped') && (needs.frontend-check.result == 'success' || needs.frontend-check.result == 'skipped') && (needs.smoke-import.result == 'success' || needs.smoke-import.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Placeholder deploy step
        run: echo "Deploy to staging here (rsync, SSH, Docker, Fly.io, Render, etc.)"

  slack-notify:
    if: always()
    needs: [lint-and-test, frontend-check, smoke-import, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "*CI výsledek:* ${{ job.status }}\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nAutor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
